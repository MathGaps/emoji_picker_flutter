group 'com.fintasys.emoji_picker_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Required by AGP 8: the namespace used to live in the manifest's `package`
    // attribute, which AGP no longer reads.
    namespace 'com.fintasys.emoji_picker_flutter'
    compileSdk 34

    // Kotlin compiles at the toolchain's JVM target (17 on current Flutter);
    // javac must match or Gradle rejects the variant as inconsistent.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // PaintCompat.hasGlyph, used by EmojiPickerFlutterPlugin.
    implementation 'androidx.core:core:1.13.1'
}
